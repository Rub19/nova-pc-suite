[package]
name = "nova-native"
version = "0.4.0"
edition = "2021"
description = "Entretien et réparation de Windows"
license = "MIT"

[features]
headless = ["slint/renderer-software"]
e2e = ["headless", "dep:i-slint-backend-testing"]

[dependencies]
nova-engine = { path = "../engine" }
serde_json = "1"
png = "0.18"
slint = "1.18"
i-slint-backend-testing = { version = "=1.18.1", optional = true }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"
