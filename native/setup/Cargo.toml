[package]
name = "nova-setup"
version = "0.4.0"
edition = "2021"
publish = false

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "unstable-winit-030"] }
flate2 = "1"
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"
