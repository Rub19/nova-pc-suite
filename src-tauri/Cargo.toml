[package]
name = "nova-pc-suite"
version = "0.3.0"
edition = "2021"
description = "Windows maintenance and driver management"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
nova-engine = { path = "../native/engine" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
