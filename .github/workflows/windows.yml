name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: powershell -NoProfile -File tests/system-tests.ps1
      - run: powershell -NoProfile -File tests/backend-safety-tests.ps1
      - run: powershell -NoProfile -File tests/optimize-tests.ps1
      - run: powershell -NoProfile -File tests/apps-tests.ps1
      - run: powershell -NoProfile -File tests/automation-tests.ps1
      - run: powershell -NoProfile -File tests/health-tests.ps1
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked
      - run: npm run tauri:build -- --ci
      - run: powershell -NoProfile -File scripts/test-installer.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Nova-PC-Suite-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/nova-pc-suite.exe
